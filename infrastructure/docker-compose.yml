version: '3.8'

services:
  frontend-web:
    build:
      context: ../frontend-web
      dockerfile: Dockerfile
    container_name: docgia-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend-web:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
